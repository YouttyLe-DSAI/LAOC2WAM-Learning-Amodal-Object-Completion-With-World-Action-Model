# ============================================================
# Config trung tâm cho pipeline fine-tune amodal completion
# ============================================================

paths:
  raw_images: data/raw
  cocoa_dir: data/cocoa
  pseudo_labels: data/pseudo_labels
  # LƯU Ý: trỏ thẳng vào instance_images/ (nơi có ảnh + metadata.jsonl),
  # không phải data/train_ready (thư mục cha) -- xem 02b_prepare_dreambooth_data.py
  train_ready: data/train_ready/instance_images
  output_dir: outputs

pseudo_label:
  vlm_model: gpt-4o
  instance_prompt: "a photo of sks object"
  class_prompt: "a photo of an object"
  dilate_kernel: 5

model:
  # QUAN TRỌNG: dùng bản SD text-to-image thường (4-kênh input), KHÔNG dùng
  # bản "-inpainting" (9-kênh) ở đây.
  base_model: "runwayml/stable-diffusion-v1-5"
  resolution: 512

train:
  mode: lora
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 1e-4
  train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 50
  max_train_steps: null
  mixed_precision: "fp16"
  prior_preservation: true
  prior_loss_weight: 1.0
  num_class_images: 50
  seed: 42
  checkpointing_steps: 200

eval:
  metrics: [clip_score, lpips, ssim]
  test_split_from_cocoa: true
  n_test_images: 20
