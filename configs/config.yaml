# ============================================================
# Config trung tâm cho pipeline fine-tune amodal completion
# ============================================================

paths:
  raw_images: data/raw
  cocoa_dir: data/cocoa
  pseudo_labels: data/pseudo_labels
  train_ready: data/train_ready/instance_images
  output_dir: outputs

pseudo_label:
  # Model dùng làm Occlusion / Boundary / Description agent
  vlm_model: gpt-4o
  instance_prompt: "a photo of sks backpack"
  class_prompt: "a photo of backpack"
  dilate_kernel: 5                           # dilation cho occluder mask (px)

model:
  base_model: "runwayml/stable-diffusion-v1-5"
  resolution: 512
  # đổi sang "stabilityai/stable-diffusion-2-inpainting" nếu muốn bản lớn hơn

train:
  mode: lora            # lora | full_dreambooth
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  learning_rate: 1e-4
  train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 50
  max_train_steps: null        # null = tính từ num_train_epochs
  mixed_precision: "fp16"      # fp16 phù hợp T4/P100 trên Kaggle
  prior_preservation: true
  prior_loss_weight: 1.0
  num_class_images: 50         # ảnh "class" sinh tự động cho prior preservation
  seed: 42
  checkpointing_steps: 200

eval:
  metrics: [clip_score, lpips, ssim]
  test_split_from_cocoa: true
  n_test_images: 20
